name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Opt into Node 24 for JS actions (silences the Node 20 deprecation notice).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships docker + docker compose, which Testcontainers
      # (ComposeContainer.withLocalCompose) uses to bring up Solr for the
      # functional tests.
      - name: Build and run functional tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
