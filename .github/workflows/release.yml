name: Release

# Builds the runnable fat jar and attaches it to a GitHub release when a
# version tag (v*) is pushed.
on:
  push:
    tags: [ 'v*' ]

jobs:
  jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar (skip tests)
        run: ./gradlew shadowJar --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/solr-mcp-*-all.jar
