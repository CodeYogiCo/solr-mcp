# slf4j-simple writes to System.err by default, which keeps stdout clean for the
# STDIO JSON-RPC stream. Do not point this at System.out.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.log.org.apache.solr=warn
